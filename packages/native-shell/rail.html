<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zugoid Servers</title>
  <link rel="stylesheet" href="rail.css">
</head>
<body>
  <nav aria-label="Servers">
    <button id="list" type="button" aria-label="All Servers">
      <svg class="zug-idle" viewBox="0 0 32 32" width="28" height="28" fill="currentColor" aria-hidden="true"><defs><mask id="zug-rail" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><g class="zug-p"><rect x="5" y="9" width="4" height="4" fill="#000"/><rect x="23" y="9" width="4" height="4" fill="#000"/></g></mask></defs><g class="zug-e" mask="url(#zug-rail)"><rect x="2" y="6" width="10" height="10"/><rect x="20" y="6" width="10" height="10"/></g><rect x="2" y="22" width="28" height="4"/></svg>
    </button>
    <ul id="servers"></ul>
    <button id="add" type="button" aria-label="Add a Server">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>
  <script src="rail.js"></script>
</body>
</html>
