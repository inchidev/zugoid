<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Zugoid</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main>
    <h1 aria-label="Zugoid">
      <svg class="zug-idle" viewBox="0 0 32 32" width="48" height="48" fill="currentColor" aria-hidden="true"><defs><mask id="zug-home" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><g class="zug-p"><rect x="5" y="9" width="4" height="4" fill="#000"/><rect x="23" y="9" width="4" height="4" fill="#000"/></g></mask></defs><g class="zug-e" mask="url(#zug-home)"><rect x="2" y="6" width="10" height="10"/><rect x="20" y="6" width="10" height="10"/></g><rect x="2" y="22" width="28" height="4"/></svg>
    </h1>
    <form id="add" novalidate>
      <input type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="community.example.com" aria-label="Server address" required>
      <button type="submit">Add</button>
    </form>
    <button id="scan" type="button" hidden>Scan a code</button>
    <p id="error" role="alert"></p>
    <p id="empty">Add a Server by its address, or scan its code from Connections in its settings. You sign in on the Server itself.</p>
    <ul id="servers"></ul>
  </main>
  <dialog id="confirm-remove">
    <p id="confirm-remove-text"></p>
    <p class="note">Your account on the Server is not affected.</p>
    <form method="dialog">
      <button value="cancel">Cancel</button>
      <button value="remove" class="danger">Remove</button>
    </form>
  </dialog>
  <script src="shell.js"></script>
</body>
</html>
