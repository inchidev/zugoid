services:
  zugoid:
    image: ${ZUGOID_PROJECT:-zugoid}-dev:celld-0.6.3
    build:
      context: ..
      dockerfile: self-host/Dockerfile
      target: development
    volumes:
      - ../.deployment/dev-stack/backend:/opt/zugoid/.output:ro
      - ../wrangler.celld.json:/opt/zugoid/wrangler.celld.json:ro
      - ../drizzle/server-migrations:/opt/zugoid/drizzle/server-migrations:ro
    environment:
      ZUGOID_DEV_RELOAD: "true"
  gateway:
    environment:
      ZUGOID_FRONTEND_PORT: ${ZUGOID_FRONTEND_PORT:?set ZUGOID_FRONTEND_PORT}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
